name: Build & Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  get_version:
    name: Get version from Cargo.toml
    runs-on: ubuntu-22.04

    outputs:
      release_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Getting version
        id: get-version
        run: |
          VERSION=$(sed -nE 's/^version\s*=\s*(\S*)$/\1/p' Cargo.toml | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


  create_release_draft:
    name: Create the release draft
    runs-on: ubuntu-latest

    needs:
      - get_version

    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v1

      - name: Create release draft
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get_version.outputs.release_version }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: |
          RELEASE=$(gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/releases" \
            --field "tag_name=${VERSION}" \
            --field "name=tiny_http_client v. ${VERSION}" \
            --field "body=${RELEASE_NOTES}" \
            --field "draft=true" \
            --field "prerelease=false")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')

          UPLOAD_URL=$(echo "$RELEASE" | jq -r '.upload_url' | sed 's/{?name,label}//')

          echo "Created release:"
          echo "  ID: ${RELEASE_ID}"
          echo "  Upload URL: ${UPLOAD_URL}"

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"
